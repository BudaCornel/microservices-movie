server:
  port: 8081

spring:
  application:
    name: movie-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/movie_db}
    username: ${SPRING_DATASOURCE_USERNAME:msuser}
    password: ${SPRING_DATASOURCE_PASSWORD:mspass}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

recommendation:
  service:
    url: ${RECOMMENDATION_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,metrics
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true


breaker:
  sliding-window-size: 10
  minimum-calls: 5
  failure-rate-threshold: 50
  wait-duration: PT10S
  permitted-calls-in-half-open: 3


logging:
  level:
    io.github.resilience4j: INFO
    com.cornel.movie: INFO
