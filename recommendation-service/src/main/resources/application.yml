server:
  port: 8082

spring:
  application:
    name: recommendation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recommendation_db}
    username: ${SPRING_DATASOURCE_USERNAME:msuser}
    password: ${SPRING_DATASOURCE_PASSWORD:mspass}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info