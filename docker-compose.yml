services:
  postgres:
    image: postgres:16-alpine
    container_name: ms-postgres
    environment:
      POSTGRES_USER: msuser
      POSTGRES_PASSWORD: mspass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U msuser -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  recommendation-service:
    build: ./recommendation-service
    container_name: ms-recommendation
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recommendation_db
      SPRING_DATASOURCE_USERNAME: msuser
      SPRING_DATASOURCE_PASSWORD: mspass
      CHAOS_MODE: ${CHAOS_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  movie-service:
    build: ./movie-service
    container_name: ms-movie
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movie_db
      SPRING_DATASOURCE_USERNAME: msuser
      SPRING_DATASOURCE_PASSWORD: mspass
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      recommendation-service:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    container_name: ms-gateway
    ports:
      - "8080:8080"
    environment:
      MOVIE_SERVICE_URL: http://movie-service:8081
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:8082
    depends_on:
      - movie-service
      - recommendation-service

volumes:
  postgres-data:
