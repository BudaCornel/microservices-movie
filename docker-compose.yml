services:
  postgres:
    image: postgres:16-alpine
    container_name: ms-postgres
    environment:
      POSTGRES_USER: msuser
      POSTGRES_PASSWORD: mspass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msuser"]
      interval: 5s
      timeout: 5s
      retries: 10

  recommendation-service:
    build: ./recommendation-service
    container_name: ms-recommendation
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/recommendation_db
      SPRING_DATASOURCE_USERNAME: msuser
      SPRING_DATASOURCE_PASSWORD: mspass
      CHAOS_MODE: ${CHAOS_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: